<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div>
        <h1>Dona Benta</h1>
    </div>
    <section  class="catalogo">
        <article class="card">

            <img src="img/feijaoComFarinha.jpg" alt="Feijão com Farinha" class="foto-card">
            <h3>Feijão com Farinha</h3>
            <p>Fala um frase em inglês ai. Claro...Feijão com Farinha</p>
            <p class="preco">$35,00</p>
        </article>

        <article class="card">

            <img src="img/Cuscuz.jpg" alt="Feijão com Farinha" class="foto-card">
            <h3>Cuscuz de ralo</h3>
            <p>Todas as sobras do dia que ficaram no ralo em um delicioso cuscuz</p>
            <p class="preco">$45,99</p>
        </article>

        <article class="card">

            <img src="img/frango com quiabo.jpg" alt="Feijão com Farinha" class="foto-card">
            <h3>Frango com quiabo</h3>
            <p>Feijão e quiabo</p>
            <p class="preco">$38,90</p>
        </article>

    </section>


</body>

</html>
