<!DOCTYPE html>

            <h2>Pizza de Calabresa</h2>
            <p>Pizza de calabresa com queijo, cebola e molho de tomate.</p>

        </div>

            <h3>R$ 29,90</h3>
        </div>

            <img src="https://images.unsplash.com/photo-1551024506-0bccd828d307?w=300" alt="Sobremesa">
